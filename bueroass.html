<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BüroAss – Mobiler Dienstleister</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .top-nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .btn-nav { background: rgba(255,255,255,0.12); border: 1px solid rgba(45,212,191,0.4); color: #ccfbf1; padding: 10px 16px; border-radius: 12px; text-decoration: none; font-weight: 600; cursor: pointer; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .tab { background: rgba(6,24,38,0.88); border: 1px solid rgba(45,212,191,0.3); color: #cbd5e1; padding: 12px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .tab.active { background: #0d9488; color: #fff; border-color: #2dd4bf; }
    .item-card { background: rgba(6,24,38,0.9); border: 1px solid rgba(45,212,191,0.28); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
    .kundendaten-box { background: rgba(4,18,29,0.92); border: 1px solid rgba(94,234,212,0.35); border-radius: 12px; padding: 14px; margin-top: 12px; }
    .ai-tip { background: rgba(13,148,136,0.2); border: 1px solid rgba(45,212,191,0.45); border-radius: 12px; padding: 14px; color: #ccfbf1; margin-top: 12px; }
    .field { background: rgba(4,18,29,0.95); border: 1px solid rgba(45,212,191,0.35); border-radius: 10px; padding: 12px; color: #fff; width: 100%; margin-bottom: 10px; }
  </style>
</head>
<body class="subpage-theme">
  <div class="app-shell" style="flex-direction: column; padding: 22px 18px 140px 18px;">
    <div class="top-nav">
      <div style="display:flex; gap:10px;">
        <button onclick="history.back()" class="btn-nav">← Zurück</button>
        <a href="index.html" class="btn-nav">🏠 Startseite</a>
      </div>
      <div style="color: #99f6e4; font-weight: 700;">✂️ BüroAss • Mobiler Dienstleister</div>
    </div>

    <div id="ai-toast" class="toast hidden" style="border-color: #2dd4bf; background: rgba(13,148,136,0.35);">
      <span id="ai-toast-text">✨ KI bereit...</span>
      <button onclick="document.getElementById('ai-toast').classList.add('hidden')" style="background:none;border:none;color:#fff;cursor:pointer;">✕</button>
    </div>

    <div class="tabs">
      <button onclick="showTab('termine')" id="t-termine" class="tab active">📅 Termin-Details & Lernende Kundenakte</button>
      <button onclick="showTab('finanzen')" id="t-finanzen" class="tab">💶 Einnahmen, Ausgaben & Steuer-Export</button>
    </div>

    <div id="sec-termine" class="card" style="background:rgba(8,29,44,0.88); border-color:rgba(45,212,191,0.28);">
      <h2 style="color:#ccfbf1; margin-bottom:14px;">Termin-Details inkl. Lernender Kundendaten</h2>
      <div id="list-termine"></div>
    </div>

    <div id="sec-finanzen" class="card hidden" style="background:rgba(8,29,44,0.88); border-color:rgba(45,212,191,0.28);">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
        <h2 style="color:#ccfbf1;">💶 Monatsbilanz & Steuerberater-Export</h2>
        <button onclick="exportCSV()" class="btn" style="background:#059669;">📊 Steuer-Export (CSV / Excel)</button>
      </div>
      <div id="finance-summary" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:18px;"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
        <input id="exp-name" class="field" style="flex:2; margin:0;" placeholder="Betriebsausgabe (z. B. Haarfarbe / Pflegeprodukte)" />
        <input id="exp-val" class="field" style="flex:1; margin:0;" type="number" step="0.01" placeholder="Betrag €" />
        <button onclick="addExpense()" class="btn" style="background:#dc2626;">+ Ausgabe</button>
      </div>
      <div id="list-finanzen"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="input-wrap">
      <button id="mic-btn" onclick="startVoice()" class="mic-btn" style="background:#0d9488;">🎙️</button>
      <form onsubmit="processSpeechInput(event)" class="text-form" style="border-color: rgba(45,212,191,0.35);">
        <input id="cmd-input" type="text" placeholder="Sprechen: 'Morgen 14 Uhr Frau Müller, Haarschnitt und Farbe, 85 Euro'..." />
        <button type="submit" class="btn" style="background:#0d9488;">KI-Anlage</button>
      </form>
    </div>
  </div>
  <script>
    const defaultDB = {
      termine: [
        { id: 1, zeit: "Morgen, 14:00 Uhr", kunde: "Frau Müller", leistung: "Haarschnitt und Farbe", preis: 85, notiz: "Letzter Besuch: Ansatzfärbung Naturbraun. Kopfhaut leicht empfindlich.", kiTipp: "Vorbereitung: Ammoniakfreie Farbe bereitlegen. Zusatz-Vorschlag: Feuchtigkeits-Kur (+15 €) wegen trockener Spitzen empfehlen." }
      ],
      kunden: {
        "Frau Müller": { besuche: 4, vorlieben: "Naturbraun, warmer Glanz", allergien: "Empfindliche Kopfhaut (kein Ammoniak)", letzterPreis: "85,00 €", historie: ["Haarschnitt & Farbe (85 €)", "Spitzen schneiden (45 €)"] }
      },
      finanzen: [
        { datum: "27.11.2026", typ: "Einnahme", text: "Frau Müller – Haarschnitt und Farbe", betrag: 85.00 },
        { datum: "25.11.2026", typ: "Ausgabe", text: "Großhandel Pflege- & Farbset", betrag: -32.50 }
      ]
    };

    function getDB() { return JSON.parse(localStorage.getItem('boss_dl_db')) || defaultDB; }
    function saveDB(db) { localStorage.setItem('boss_dl_db', JSON.stringify(db)); renderAll(); }

    function showTab(t) {
      ['termine','finanzen'].forEach(x => {
        document.getElementById('sec-' + x).classList.add('hidden');
        document.getElementById('t-' + x).classList.remove('active');
      });
      document.getElementById('sec-' + t).classList.remove('hidden');
      document.getElementById('t-' + t).classList.add('active');
    }

    function processSpeechInput(e) {
      e.preventDefault();
      const raw = document.getElementById('cmd-input').value.trim();
      if (!raw) return;
      const db = getDB();

      const priceMatch = raw.match(/(\d+(?:[.,]\d+)?)\s*(?:euro|€)/i);
      const preis = priceMatch ? parseFloat(priceMatch[1].replace(',', '.')) : 50;
      const nameMatch = raw.match(/(Frau\s+[A-ZÄÖÜ][a-zäöüß]+|Herr\s+[A-ZÄÖÜ][a-zäöüß]+|[A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+)/);
      const kunde = nameMatch ? nameMatch[0] : "Neukunde (Sprachnotiz)";
      const timeMatch = raw.match(/(morgen\s+\d{1,2}\s*Uhr|heute\s+\d{1,2}\s*Uhr|\d{1,2}:\d{2}\s*Uhr|\d{1,2}\s*Uhr)/i);
      const zeit = timeMatch ? timeMatch[0] : "Nächster Slot";

      db.termine.unshift({
        id: Date.now(), zeit: zeit, kunde: kunde, leistung: raw, preis: preis,
        notiz: "Per Sprache erfasst: " + raw,
        kiTipp: "KI-Follow-up: Nach dem Termin Pflegehinweis senden & Folgetermin in 5 Wochen anbieten."
      });

      if (!db.kunden[kunde]) {
        db.kunden[kunde] = { besuche: 1, vorlieben: raw, allergien: "Keine bekannt", letzterPreis: preis.toFixed(2) + " €", historie: [raw] };
      } else {
        db.kunden[kunde].besuche += 1;
        db.kunden[kunde].letzterPreis = preis.toFixed(2) + " €";
        db.kunden[kunde].historie.unshift(raw);
      }

      db.finanzen.unshift({ datum: new Date().toLocaleDateString('de-DE'), typ: "Einnahme", text: kunde + " – " + raw, betrag: preis });
      saveDB(db);
      document.getElementById('cmd-input').value = '';
      showToast("✅ Termin, lernende Kundenakte & " + preis.toFixed(2) + " € Umsatz gespeichert!");
    }

    function createMsg(kunde, zeit, art) {
      let msg = "";
      if (art === 'bestaetigung') msg = `Hallo ${kunde}, hiermit bestätige ich gerne Ihren Termin (${zeit}). Ich freue mich auf Sie!`;
      if (art === 'erinnerung') msg = `Hallo ${kunde}, eine kleine Erinnerung an unseren Termin (${zeit}). Bis dahin!`;
      if (art === 'zahlung') msg = `Hallo ${kunde}, vielen Dank für Ihren Besuch! Hier ist Ihr Zahlungshinweis für die heutige Leistung.`;
      navigator.clipboard?.writeText(msg);
      showToast("📲 Nachricht kopiert (bereit für WhatsApp / E-Mail): „" + msg + "“");
    }

    function addExpense() {
      const n = document.getElementById('exp-name').value.trim();
      const v = parseFloat(document.getElementById('exp-val').value);
      if (!n || isNaN(v)) return;
      const db = getDB();
      db.finanzen.unshift({ datum: new Date().toLocaleDateString('de-DE'), typ: "Ausgabe", text: n, betrag: -Math.abs(v) });
      saveDB(db);
      document.getElementById('exp-name').value = '';
      document.getElementById('exp-val').value = '';
      showToast("✅ Betriebsausgabe verbucht!");
    }

    function exportCSV() {
      const db = getDB();
      let csv = "Datum;Typ;Beschreibung;Betrag_EUR\n";
      db.finanzen.forEach(f => { csv += `${f.datum};${f.typ};"${f.text}";${f.betrag.toFixed(2).replace('.', ',')}\n`; });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" }));
      a.download = "Steuerberater_Dienstleister.csv";
      a.click();
      showToast("📊 CSV-Datei für den Steuerberater exportiert!");
    }

    function renderAll() {
      const db = getDB();
      document.getElementById('list-termine').innerHTML = db.termine.map(t => {
        const c = db.kunden[t.kunde] || { besuche: 1, vorlieben: t.leistung, allergien: "Keine bekannt", letzterPreis: t.preis.toFixed(2) + " €", historie: [t.leistung] };
        return `<div class="item-card">
          <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
            <strong style="color:#5eead4;">🕒 ${t.zeit} – ${t.kunde}</strong>
            <span class="badge" style="background:rgba(16,185,129,0.2); border-color:#10b981; color:#a7f3d0;">${t.preis.toFixed(2)} €</span>
          </div>
          <p style="color:#e2e8f0; margin:10px 0;">${t.notiz}</p>

          <div class="kundendaten-box">
            <div style="color:#5eead4; font-weight:700; margin-bottom:6px;">🗂️ Lernende Kundendaten (${c.besuche}. Besuch • Letzter Preis: ${c.letzterPreis})</div>
            <div style="color:#cbd5e1;"><strong>Vorlieben:</strong> ${c.vorlieben}</div>
            <div style="color:#fca5a5;"><strong>Allergien / Hinweise:</strong> ${c.allergien}</div>
            <div style="color:#94a3b8; margin-top:4px;"><strong>Bisherige Termine:</strong> ${c.historie.join(' • ')}</div>
          </div>

          <div class="ai-tip">✨ <strong>KI-Vorbereitung:</strong> ${t.kiTipp}</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;">
            <button onclick="createMsg('${t.kunde}','${t.zeit}','bestaetigung')" class="btn" style="background:#0d9488;">💬 Terminbestätigung</button>
            <button onclick="createMsg('${t.kunde}','${t.zeit}','erinnerung')" class="btn" style="background:rgba(255,255,255,0.12);">⏰ Erinnerung</button>
            <button onclick="createMsg('${t.kunde}','${t.zeit}','zahlung')" class="btn" style="background:rgba(255,255,255,0.12);">💶 Zahlungshinweis</button>
          </div>
        </div>`;
      }).join('');

      let ein = 0, aus = 0;
      document.getElementById('list-finanzen').innerHTML = db.finanzen.map(f => {
        if (f.betrag >= 0) ein += f.betrag; else aus += Math.abs(f.betrag);
        return `<div class="item-card" style="display:flex; justify-content:space-between; padding:14px 16px;">
          <span>${f.datum} • ${f.text}</span>
          <strong style="color:${f.betrag >= 0 ? '#34d399' : '#f87171'};">${f.betrag >= 0 ? '+' : ''}${f.betrag.toFixed(2)} €</strong>
        </div>`;
      }).join('');
      document.getElementById('finance-summary').innerHTML = `
        <div class="inner-box"><div class="box-label">Einnahmen</div><strong style="color:#34d399;">${ein.toFixed(2)} €</strong></div>
        <div class="inner-box"><div class="box-label">Ausgaben</div><strong style="color:#f87171;">${aus.toFixed(2)} €</strong></div>
        <div class="inner-box ai"><div class="box-label">Monatsbilanz</div><strong style="color:#5eead4;">${(ein - aus).toFixed(2)} €</strong></div>`;
    }

    function showToast(t) { document.getElementById('ai-toast-text').innerText = t; document.getElementById('ai-toast').classList.remove('hidden'); }
    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast('🎙️ Bitte Textfeld nutzen.'); return; }
      const r = new SR(); r.lang = 'de-DE'; document.getElementById('mic-btn').classList.add('recording'); showToast('🎙️ Ich höre zu...');
      r.onresult = e => { document.getElementById('cmd-input').value = e.results[0][0].transcript; processSpeechInput(new Event('submit')); };
      r.onend = () => document.getElementById('mic-btn').classList.remove('recording'); r.start();
    }
    window.addEventListener('DOMContentLoaded', renderAll);
  </script>
</body>
</html>
